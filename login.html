<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入頁</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css">
    <link rel="stylesheet" href="./css/login.css">
</head>

<body>
    <div class="wrap">
        <div class="todo_img">
            <img class="logo" src="./img/logo_lg.svg">
            <img class="todo" src="./img/todo.png">
        </div>

        <div class="from">
            <h2 class="title">最實用的線上代辦事項服務</h2>
            <div>
                <p>Email</p>
                <input type="email" id="email" placeholder="請輸入Email">
            </div>
            <div>
                <p>密碼</p>
                <input type="password" id="password" placeholder="請輸入密碼">
            </div>
            <div class="btn">
                <button class="btn-logoin" id="login">登入</button>
                <button class="btn-primary" id="signup">註冊帳號</button>
            </div>
        </div>

    </div>





<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./js/login.js"></script>
</body>

</html>
